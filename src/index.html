<style>
  div.popup-root {
    position: absolute;
    top: -1rem;
    left: 0;
    width: 100%;
    height: 14rem;
    background-color: rgba(126, 126, 126, 0.05);
    backdrop-filter: blur(2rem);
    justify-content: flex-start;
    align-items: center;
    flex-direction: row;
    border-radius: 1.75rem;
    padding: 1.5rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.05);
    gap: 1.5rem;
    transform: translate(0, -100%);
    display: none;
    cursor: url(/assets/cursor-DH-OhVbX.cur);
  }

  div.popup-root .categories {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 0;
  }

  div.popup-root .categories i {
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
    color: white;
    font-size: 1rem;
    opacity: 0.3;
    cursor: url(/assets/pointer-BCNK29s4.cur);
    padding: 0.75rem 0;
  }

  div.popup-root .categories i:first-child {
    padding-top: 0;
  }

  div.popup-root .categories i:last-child {
    padding-bottom: 0;
  }

  div.popup-root .categories i.active {
    transform: scale(1.3);
    opacity: 1;
  }

  div.popup-root .categories i:not(.active):hover {
    transform: scale(1.2);
    opacity: 0.7;
  }

  div.popup-root .categories:has(i:not(.active):hover) i.active {
    transform: scale(1);
    opacity: 0.3;
  }

  div.emojis-container {
    position: relative;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.274) transparent;
    padding-right: 1rem;
  }

  div.emojis-container hr {
    width: 30%;
    border: none;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  div.emojis-container>div {
    display: grid;
    grid-template-columns: repeat(auto-fit, 2.5rem);
    gap: 1rem;
  }

  div.emojis-container div div.emoji {
    position: relative;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.7rem;
    overflow: hidden;
    cursor: url(/assets/pointer-BCNK29s4.cur);
  }

  div.emojis-container div div.emoji:hover>div {
    transition: all 0.2s ease;
    opacity: 0.99;
    filter: blur(1rem);
  }

  div.emojis-container div div.emoji>div {
    transition: all 0.2s ease;
    position: relative;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: url(/assets/pointer-BCNK29s4.cur);
    overflow: hidden;
    opacity: 0;
  }

  div.emojis-container div div.emoji img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 1.8rem;
    height: 1.8rem;
    z-index: 1;
    border-radius: 0.5rem;
    cursor: url(/assets/pointer-BCNK29s4.cur);
  }
</style>

<div class="popup-root">
  <div class="categories">
    <i class="fa-solid fa-face-laugh active" data-target="face"></i>
    <i class="fa-solid fa-paw" data-target="cats"></i>
    <i class="fa-solid fa-music" data-target="music"></i>
    <i class="fa-solid fa-infinity" data-target="symbols"></i>
  </div>
  <div class="emojis-container">
    <!-- Emojis dynamiques -->
    <div id="face"></div>
    <hr>
    <div id="cats"></div>
    <hr>
    <div id="music"></div>
    <hr>
    <div id="symbols"></div>
  </div>
</div>
